name: Update hosts

on:
  schedule:
    - cron: "17 3 * * *"   # 毎日 03:17 UTC
  workflow_dispatch:
  push:
    paths:
      - oisd2bindhosts.sh
      - .github/workflows/update.yml

permissions:
  contents: write

concurrency:
  group: update-hosts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Convert OISD big
        run: ./oisd2bindhosts.sh -o oisd_big_hosts.txt https://big.oisd.nl

      - name: Commit if changed
        run: |
          # ヘッダーの日時行を除いた本体に差分があるときだけ commit
          if git diff --quiet --ignore-matching-lines='^# Generated:' -- oisd_big_hosts.txt \
             && git ls-files --error-unmatch oisd_big_hosts.txt >/dev/null 2>&1; then
            echo "no changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oisd_big_hosts.txt
          git commit -m "Update hosts $(date -u +%F)"
          git push
