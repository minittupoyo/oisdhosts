name: Update hosts

on:
  schedule:
    - cron: "17 3 * * *"   # 毎日 03:17 UTC
  workflow_dispatch:
  push:
    paths:
      - oisd2bindhosts.sh
      - site/**
      - .github/workflows/update.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-hosts
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Convert OISD
        run: |
          ./oisd2bindhosts.sh -o oisd_big_hosts.txt https://big.oisd.nl
          ./oisd2bindhosts.sh -o oisd_small_hosts.txt https://small.oisd.nl

      - name: Publish to release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Updated: $(date -u '+%Y-%m-%d %H:%M UTC')"
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --notes "$notes" --latest
          else
            gh release create latest --title "latest" --notes "$notes" --latest
          fi
          gh release upload latest oisd_big_hosts.txt oisd_small_hosts.txt --clobber

      - name: Build Pages site
        run: |
          mkdir -p _site
          sed -e "s/__UPDATED__/$(date -u '+%Y-%m-%d %H:%M UTC')/" \
              -e "s/__BIG_COUNT__/$(grep -c '^0\.0\.0\.0 ' oisd_big_hosts.txt | sed ':a;s/\B[0-9]\{3\}\>/,&/;ta')/" \
              -e "s/__SMALL_COUNT__/$(grep -c '^0\.0\.0\.0 ' oisd_small_hosts.txt | sed ':a;s/\B[0-9]\{3\}\>/,&/;ta')/" \
              site/index.html > _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
